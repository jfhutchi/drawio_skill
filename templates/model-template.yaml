# Diagram model template. Field names match src/drawio_generator/diagram_model.py
# exactly (see schemas/diagram-model.schema.json). Author this as JSON for
# `--model model.json`; YAML works only when a yaml module is importable.
title: ""
subtitle: ""
diagram_type: enterprise   # enterprise | cloud | kubernetes | cicd | security | code | ...
audience: architect        # executive | architect | sre | developer | security
direction: left-to-right   # left-to-right | top-to-bottom
layout_strategy: layered
layers: []                 # optional layer ordering override for vertical layouts
groups: []
boundaries:
  - id: boundary-example
    label: Example Trust Boundary
    boundary_type: trust   # logical | trust | security | cloud | platform | workflow
    description: Replace with cloud, network, environment, ownership, or security boundary.
    metadata: {}
nodes:
  - id: component-example
    label: Example Component
    node_type: api         # see icon_registry.STYLE_REGISTRY keys
    icon: null             # service name ("azure kubernetes service") OR an icon found via
                           # draw.io shape search: full style, "mxgraph.<family>.<name>",
                           # or bundled image path like "azure2/devops/Azure_DevOps.svg"
    group: boundary-example
    layer: application     # optional; inferred from node_type/label when omitted
    description: Replace with purpose and ownership.
    technology: null
    risk_level: null       # high/critical adds a red warning stroke
    metadata: {}
edges:
  - id: edge-example
    source: component-example
    target: component-example
    label: HTTPS request
    protocol: HTTPS
    direction: forward
    data_classification: internal
    security_control: TLS
    style: null            # optional raw draw.io edge style override
    metadata:
      sequence: 1          # optional flow number; renumbered 1..n per page
      flow_type: control   # control | target_collection | report_evidence | optional_storage | security_sensitive
legends:
  - label: Blue
    meaning: Application, platform, and network services
    color: null
annotations: []
assumptions: []
unknowns: []
sources: []
quality_checks: []
metadata: {}               # optional; visual_pattern_id selects column ordering
